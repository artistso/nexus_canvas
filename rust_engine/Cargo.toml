[package]
name = "nexus_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "nexus_engine"

[dependencies]
# ECS Core
bevy_ecs = "0.13"
bevy_utils = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math
nalgebra = { version = "0.32", features = ["serde-serialize"] }

# Uniffi Bindings
uniffi = { version = "0.27", features = ["build"] }

# Color Science (OKLCH)
palette = { version = "0.7", features = ["serializing"] }

# Error Handling
thiserror = "1.0"

# Async runtime for file I/O
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
uniffi = { version = "0.27", features = ["build", "bindgen"] }

bincode = "1.3.3"
